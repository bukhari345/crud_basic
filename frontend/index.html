<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User CRUD</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f2f5;
    color: #333;
    padding: 30px;
  }
  h1 { text-align: center; margin-bottom: 25px; color: #2c3e50; }
  .container { max-width: 900px; margin: auto; }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 25px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 15px;
  }
  input {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    width: 100%;
  }
  input:focus { outline: none; border-color: #3498db; }
  .btn {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    color: #fff;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.9; }
  .btn-save { background: #27ae60; }
  .btn-clear { background: #95a5a6; }
  .btn-edit { background: #f39c12; }
  .btn-delete { background: #e74c3c; }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #eee;
  }
  th { background: #34495e; color: #fff; }
  tr:hover { background: #f9f9f9; }
  .actions button { margin-right: 6px; padding: 6px 12px; font-size: 13px; }
  #msg {
    text-align: center;
    margin-bottom: 15px;
    font-weight: bold;
    min-height: 20px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>User Management (CRUD)</h1>

  <div id="msg"></div>

  <div class="card">
    <div class="form-grid">
      <input type="number" id="id" placeholder="ID">
      <input type="text" id="name" placeholder="Name">
      <input type="email" id="email" placeholder="Email">
      <input type="number" id="age" placeholder="Age">
      <input type="text" id="city" placeholder="City">
    </div>
    <button class="btn btn-save" onclick="saveUser()">Save</button>
    <button class="btn btn-clear" onclick="clearForm()">Clear</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Email</th><th>Age</th><th>City</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>
  </div>
</div>

<script>
  const API = 'http://localhost:3000/users';
  let editing = false;

  // Show a temporary message
  function showMsg(text, color = '#27ae60') {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.style.color = color;
    setTimeout(() => (msg.textContent = ''), 3000);
  }

  // READ - load all users
  async function loadUsers() {
    try {
      const res = await fetch(API);
      const users = await res.json();
      const table = document.getElementById('userTable');
      table.innerHTML = '';
      users.forEach(u => {
        table.innerHTML += `
          <tr>
            <td>${u.id}</td>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.age}</td>
            <td>${u.city}</td>
            <td class="actions">
              <button class="btn btn-edit" onclick="editUser(${u.id}, '${u.name}', '${u.email}', ${u.age}, '${u.city}')">Edit</button>
              <button class="btn btn-delete" onclick="deleteUser(${u.id})">Delete</button>
            </td>
          </tr>`;
      });
    } catch (err) {
      showMsg('Failed to load users', '#e74c3c');
    }
  }

  // CREATE / UPDATE
  async function saveUser() {
    const id = document.getElementById('id').value;
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const age = document.getElementById('age').value;
    const city = document.getElementById('city').value;

    if (!id || !name || !email || !age || !city) {
      showMsg('Please fill all fields', '#e74c3c');
      return;
    }

    const data = { id, name, email, age, city };

    try {
      let res;
      if (editing) {
        res = await fetch(`${API}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } else {
        res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      }
      const result = await res.json();
      if (res.ok) {
        showMsg(editing ? 'User updated' : 'User created');
        clearForm();
        loadUsers();
      } else {
        showMsg(result.error || 'Operation failed', '#e74c3c');
      }
    } catch (err) {
      showMsg('Server error', '#e74c3c');
    }
  }

  // Fill form for editing
  function editUser(id, name, email, age, city) {
    document.getElementById('id').value = id;
    document.getElementById('name').value = name;
    document.getElementById('email').value = email;
    document.getElementById('age').value = age;
    document.getElementById('city').value = city;
    document.getElementById('id').disabled = true;  // don't change primary key
    editing = true;
    showMsg('Editing mode - update the fields and save', '#f39c12');
  }

  // DELETE
  async function deleteUser(id) {
    if (!confirm('Delete this user?')) return;
    try {
      const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
      const result = await res.json();
      if (res.ok) {
        showMsg('User deleted');
        loadUsers();
      } else {
        showMsg(result.message || 'Delete failed', '#e74c3c');
      }
    } catch (err) {
      showMsg('Server error', '#e74c3c');
    }
  }

  // Reset form
  function clearForm() {
    document.getElementById('id').value = '';
    document.getElementById('name').value = '';
    document.getElementById('email').value = '';
    document.getElementById('age').value = '';
    document.getElementById('city').value = '';
    document.getElementById('id').disabled = false;
    editing = false;
  }

  // Initial load
  loadUsers();
</script>
</body>
</html>
