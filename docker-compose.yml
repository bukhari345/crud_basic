services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-crud}
    volumes:
      - db_data:/var/lib/mysql
      # Seed the schema on first boot.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # In CI/production we point this at the image built by GitHub Actions.
    # Locally you can instead run: docker compose up --build
    image: ${APP_IMAGE:-crud-app:local}
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpass}
      DB_NAME: ${DB_NAME:-crud}
      DB_PORT: 3306
      PORT: 3000
    ports:
      - "80:3000"   # host port 80 -> container port 3000, so the app is reachable on the EC2 public IP

volumes:
  db_data:
